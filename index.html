<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PingHub Realistic Neon Emblem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body style="background: #06090e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 170" width="540" height="170" style="background: transparent;">
    <defs>
      <!-- Deep Electric Cyan Neon Glow -->
      <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.5" result="core" />
        <feGaussianBlur stdDeviation="5" result="medium" />
        <feGaussianBlur stdDeviation="12" result="outer" />
        <feMerge>
          <feMergeNode in="outer" />
          <feMergeNode in="medium" />
          <feMergeNode in="core" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Warm Amber/Gold Glow for HUB -->
      <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.5" result="core" />
        <feGaussianBlur stdDeviation="5" result="medium" />
        <feGaussianBlur stdDeviation="10" result="outer" />
        <feMerge>
          <feMergeNode in="outer" />
          <feMergeNode in="medium" />
          <feMergeNode in="core" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <g transform="translate(20, 15)">
      <!-- REALISTIC TABLE TENNIS RACKET -->
      <g id="pro-racket" transform="rotate(-28 75 75)">
        
        <!-- Authentic ITTF Blade / Rubber Contour -->
        <!-- Shape features the true wide sweet spot and curved transition toward the neck -->
        <path d="M 42,48 
                 C 34,18 70,8 86,8 
                 C 102,8 138,18 130,48 
                 C 126,64 122,86 104,95 
                 C 98,98 94,98 92,100 
                 L 80,100 
                 C 78,98 74,98 68,95 
                 C 50,86 46,64 42,48 Z" 
              fill="none" 
              stroke="#00f0ff" 
              stroke-width="3.5" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              filter="url(#glow-cyan)" />

        <!-- Rubber Base Cutout Arc (Shows exposed wooden shoulder) -->
        <path d="M 64,93 C 74,86 98,86 108,93" 
              fill="none" 
              stroke="#00f0ff" 
              stroke-width="2.2" 
              opacity="0.8" 
              filter="url(#glow-cyan)" />

        <!-- Authentic Flared (FL) Ergonomic Grip Handle -->
        <path d="M 80,100 
                 L 82,128 
                 C 82,136 86,146 88,148 
                 C 87,150 83,151 76,151 
                 C 69,151 65,150 64,148 
                 C 66,146 70,136 70,128 
                 L 72,100 Z" 
              fill="none" 
              stroke="#e2e8f0" 
              stroke-width="3" 
              stroke-linejoin="round" 
              stroke-linecap="round"
              filter="url(#glow-cyan)" />

        <!-- Flared Handle Grip Core Line -->
        <line x1="76" y1="108" x2="76" y2="142" stroke="#00f0ff" stroke-width="1.8" opacity="0.65" filter="url(#glow-cyan)" />
      </g>

      <!-- SEAMLESS ABS 40+ BALL (White Core with Cyan Aura) -->
      <circle cx="150" cy="40" r="8.5" fill="#ffffff" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow-cyan)" />
      
      <!-- Ball Spin / Trajectory Streak -->
      <path d="M 166,42 Q 186,47 200,56" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,5" opacity="0.75" filter="url(#glow-cyan)" />

      <!-- TYPOGRAPHY -->
      <!-- "PING" in Crisp Laser White / Ice Cyan -->
      <text x="205" y="98" 
            font-family="'Space Grotesk', sans-serif" 
            font-size="62" 
            font-weight="800" 
            letter-spacing="2" 
            fill="#ffffff" 
            stroke="#00f0ff" 
            stroke-width="1.5" 
            filter="url(#glow-cyan)">PING</text>

      <!-- "HUB" in Clean Neon Amber / Gold (Replaced the Pink) -->
      <text x="368" y="98" 
            font-family="'Space Grotesk', sans-serif" 
            font-size="62" 
            font-weight="800" 
            letter-spacing="2" 
            fill="#ffb800" 
            stroke="#ffb800" 
            stroke-width="1.5" 
            filter="url(#glow-amber)">HUB</text>

      <!-- Subtitle Badge -->
      <text x="208" y="124" 
            font-family="'JetBrains Mono', monospace" 
            font-size="11.5" 
            font-weight="700" 
            letter-spacing="5" 
            fill="#94a3b8" 
            opacity="0.9">AUTONOMOUS CLUB &bull; 24/7</text>
    </g>
  </svg>

</body>
</html>
